name: Deploy

on:
  push:
    branches: [main]
  # PRs (incl. dependabot's) get the test job as a pre-merge check; the
  # build-and-push + deploy jobs are push-to-main only (see their `if:`).
  pull_request:
    branches: [main]

# Per-ref: each PR gets its own group (new pushes cancel that PR's stale
# run), and main's deploys never collide with PR runs. Main runs queue
# instead of cancelling, so a quick second push can't kill a deploy midway.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; build-and-push adds packages: write.
permissions:
  contents: read

env:
  # GHCR image names must be lowercase; must match docker-compose.yml.
  IMAGE: ghcr.io/jaaaayden/personal-website

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Prove the site compiles (type-checks + bundles) before merge/deploy;
      # without this a PR can be green yet break the image build on main.
      - run: npm run build

  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Fails until the VPS exists and the three secrets are set — expected.
  # Setup runbook: docs/DEPLOYMENT.md
  deploy:
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/personal-website
            git pull --ff-only
            # All services, not just app, so Caddy picks up its updates too.
            docker compose pull
            docker compose up -d --no-build
            docker image prune -f
